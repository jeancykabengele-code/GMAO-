services:
  - type: web
    name: gmao-ordc-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./gmao/Dockerfile
    dockerContext: ./gmao
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: GMAO_HEALTH_TOKEN
        generateValue: true
      - key: GMAO_PWNED_PASSWORD_CHECK
        value: "true"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "3600"
      - key: FRONTEND_ORIGINS
        value: https://gmao-ordc.vercel.app
      - key: GMAO_DATABASE_ENGINE
        value: mysql
      - key: AIVEN_MYSQL_HOST
        sync: false
      - key: AIVEN_MYSQL_PORT
        sync: false
      - key: AIVEN_MYSQL_DATABASE
        sync: false
      - key: AIVEN_MYSQL_USER
        sync: false
      - key: AIVEN_MYSQL_PASSWORD
        sync: false
      - key: AIVEN_MYSQL_CA_PEM
        sync: false
