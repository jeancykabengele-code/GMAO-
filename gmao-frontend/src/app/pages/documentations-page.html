<section class="documentation-page">
  <div class="content-card">
    <div class="page-toolbar">
      <div class="page-heading">
        <h1>Documentations</h1>
        <p>Téléchargement sécurisé des données opérationnelles au format Excel XLSX.</p>
      </div>
    </div>

    @if (canExportExcel) {
    <div class="report-grid">
      @for (report of reports; track report.fileName) {
        <article class="report-card">
          <div class="report-icon"><i class="solaris-icon solaris-table"></i></div>
          <div class="report-copy">
            <h2>{{ report.title }}</h2>
          </div>
          <button type="button" class="export-excel-button" (click)="exportReport(report)">
            <i class="solaris-icon solaris-excel"></i>
            Télécharger le fichier Excel
          </button>
        </article>
      }
    </div>
    }
  </div>
</section>
