<section class="visual-entry" aria-label="Accueil GMAO ORDC">
  <header class="brand-header">
    <img src="/assets/orange/logo/orange-master-logo.png" alt="Orange" width="72" height="72">

  </header>

  <main class="identity-block">
    <div class="identity-content">

      <h1>GMAO</h1>
      <span class="orange-line" aria-hidden="true"></span>
      <p class="identity-subtitle">Outil de Gestion et de Planification Data Center ORDC.</p>
      <a class="login-button" routerLink="/connexion" [queryParams]="loginQueryParams" (click)="allowPortalEntry()">
        <span>Se connecter</span>
        <i class="solaris-icon solaris-forward"></i>
      </a>
    </div>
  </main>
</section>
