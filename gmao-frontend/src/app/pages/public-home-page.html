<section class="visual-entry" aria-label="Accueil GMAO ORDC">
  <a class="login-button" routerLink="/connexion" [queryParams]="loginQueryParams" (click)="allowPortalEntry()">
    <span>Se connecter</span>
    <i class="bi bi-arrow-right"></i>
  </a>

  <div class="identity-block">
    <p class="identity-title"><strong>Outil de Gestion de Maintenance Assistée par Ordinateur</strong></p>
    <div class="logo-blend">
      <img src="/images/orange-logo.png" alt="Orange">
    </div>
    <p class="identity-subtitle">Plateforme de traçabilité des opérations liées au Data Center ORDC</p>
  </div>
</section>
