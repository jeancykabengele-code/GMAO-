# Hôte virtuel Nginx de GMAO sous Laragon : interface Angular + proxy vers l'API Django.
# À copier dans C:\laragon\etc\nginx\sites-enabled\gmao.test.conf puis redémarrer Nginx.
# L'interface est servie depuis C:/GMAO/web (hors du dossier www, pour que Laragon ne génère pas
# d'hôte automatique concurrent) ; l'API écoute sur 127.0.0.1:8081 (jamais 8080 : Laragon y place parfois le port HTTP de Nginx) (ops\laragon\start-api.ps1).

server {
    listen 80;
    server_name gmao.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name gmao.test;

    # Certificat généré par Laragon (Menu > Nginx > SSL). Vérifier ces chemins dans le fichier
    # généré par Laragon pour un autre hôte, ou utiliser le certificat de l'entreprise.
    ssl_certificate     C:/laragon/etc/ssl/laragon.crt;
    ssl_certificate_key C:/laragon/etc/ssl/laragon.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root C:/GMAO/web;
    index index.html;

    client_max_body_size 5m;

    # Mêmes protections que vercel.json, avec l'API sur la même origine.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'; worker-src 'none'; require-trusted-types-for 'script'; trusted-types angular angular#bundler; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=3600" always;

    # API et sondes de santé.
    location ~ ^/(api/|health) {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Ces deux fichiers doivent toujours être relus (nouvelle version publiée).
    location = /index.html  { expires -1; }
    location = /version.json { expires -1; }

    # Les fichiers générés par le build portent une empreinte dans leur nom.
    location ~* \.(?:js|css|woff2?|ttf|png|jpe?g|svg|ico|webp)$ {
        expires 30d;
        try_files $uri =404;
    }

    # Application monopage : toute route inconnue renvoie index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
