name: CI

permissions:
  contents: read


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gmao-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gmao-frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run vercel-build
        env:
          GMAO_API_URL: https://api.example.invalid

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gmao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: gmao/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python manage.py test
      - run: python manage.py check --deploy
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-unique-characters-123456789
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SECURE_HSTS_SECONDS: "3600"

