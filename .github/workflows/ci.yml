name: CI

permissions:
  contents: read


on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gmao-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gmao-frontend/package-lock.json
      - run: npm ci
      - run: npm run vercel-build
        env:
          GMAO_API_URL: https://gmao-ordc-api.onrender.com
      - name: Installer Chromium pour la validation CSP
        run: npx playwright install --with-deps chromium
      - name: Vérifier la CSP et les sessions dans Chromium (API simulée)
        run: npm run test:csp
      - name: Publier le rapport des tests Angular
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angular-test-results
          path: gmao-frontend/test-results/junit.xml
          if-no-files-found: warn
          retention-days: 14

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql-ci-only-password
          MYSQL_DATABASE: gmao_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-unique-characters-123456789
    defaults:
      run:
        working-directory: gmao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: gmao/requirements.txt
      - run: python -m pip install -r requirements.txt "PyMySQL[rsa]>=1.1,<2"
      - name: Tester la sonde de disponibilité
        run: python -m unittest discover -s ../ops -p "test_*.py" -v
      - run: python manage.py test
      - name: Vérifier les compteurs concurrents sur MySQL
        run: python manage.py test login_guard --settings=gmao_backend.mysql_test_settings --verbosity 2
        env:
          GMAO_MYSQL_TESTS: "1"
      - name: Répéter les scénarios de concurrence MySQL
        run: |
          for attempt in 1 2 3 4 5; do
            python manage.py test login_guard.tests.ConcurrentLoginTests --settings=gmao_backend.mysql_test_settings --verbosity 1
          done
        env:
          GMAO_MYSQL_TESTS: "1"
      - run: python manage.py check --deploy
        env:
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SECURE_HSTS_SECONDS: "3600"
